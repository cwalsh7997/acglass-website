<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero composition B: scrim</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  body{margin:0;background:var(--paper);color:var(--ink-900);font-family:var(--font-sans)}
  .wrap{max-width:var(--w-content);margin:0 auto;padding:var(--s-16) var(--gutter-desk)}
  .hero{position:relative;aspect-ratio:4/3;max-height:540px;overflow:hidden;
        border-radius:var(--r-1);border:1px solid var(--line-200)}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  /* Scrim is the measured value from rules/01, held in tokens.css. */
  .scrim{position:absolute;inset:0;background:var(--scrim-photo)}
  .copy{position:absolute;left:0;right:0;bottom:0;padding:var(--s-12) var(--s-10)}
  .eyebrow{font-family:var(--font-mono);font-size:var(--fs-sm);line-height:var(--lh-sm);
           text-transform:var(--tr-mono-upper);color:var(--on-navy-secondary);margin:0 0 var(--s-3)}
  h1{font-size:var(--fs-display);line-height:var(--lh-display);color:var(--paper);
     margin:0 0 var(--s-4);max-width:var(--measure)}
  .lead{font-size:var(--fs-lead);line-height:var(--lh-lead);color:var(--paper);
        margin:0 0 var(--s-8);max-width:var(--measure)}
  .actions{display:flex;gap:var(--s-3);flex-wrap:wrap}
  .btn{font-size:var(--fs-body);line-height:var(--lh-body);padding:var(--s-3) var(--s-6);
       border-radius:var(--r-2);text-decoration:none;border:1px solid var(--paper);
       transition:background var(--dur-base) var(--ease-out)}
  .btn-p{background:var(--paper);color:var(--navy-800)}
  .btn-s{background:transparent;color:var(--paper)}
  .cap{font-family:var(--font-mono);font-size:var(--fs-sm);line-height:var(--lh-sm);
       color:var(--ink-700);margin:var(--s-3) 0 0}
  @media (max-width:900px){
    .wrap{padding:var(--s-12) var(--gutter-mob)}
    .hero{aspect-ratio:3/4;max-height:none}
    .copy{padding:var(--s-8) var(--s-6)}
  }
</style></head><body>
<div class="wrap">
  <figure style="margin:0">
    <div class="hero">
      <img src="../../images/hero/tower-360.jpg" width="720" height="540"
           fetchpriority="high" decoding="async"
           alt="Aluminium curtain wall elevation with vertical mullion lines">
      <div class="scrim"></div>
      <div class="copy">
        <p class="eyebrow">Division 08 subcontractor</p>
        <h1>Commercial glazing, engineered to survive the inspection.</h1>
        <p class="lead">Storefront, curtain wall and impact glazing across Florida.</p>
        <div class="actions">
          <a class="btn btn-p" href="#">Send plans</a>
          <a class="btn btn-s" href="#">See past performance</a>
        </div>
      </div>
    </div>
    <figcaption class="cap">Phase 3 replaces this with an approved project photograph.</figcaption>
  </figure>
</div>
</body></html>
