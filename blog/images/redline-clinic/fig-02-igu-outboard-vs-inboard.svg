<text x="80" y="400" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#1c1916">A Miami-Dade NOA or Florida Product Approval is wind and impact. It does not prove the inboard lite is laminated.</text>
<text x="80" y="424" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#1c1916">UFC 5-11.1: min. 1/4 in laminated or polycarbonate, or two 1/8 in plies with 0.030 in PVB. On an IGU the innermost lite must be laminated or PC.</text>
<text x="80" y="456" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b42318">REDLINE: do not shop an outboard-laminate impact IGU and call the UFC side done.</text>
<text x="80" y="488" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6258">No NOA ID, psi, U-factor, or SHGC on this figure. Those values stay on the project schedule.</text>
