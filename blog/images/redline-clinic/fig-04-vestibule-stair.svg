<text x="80" y="530" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#1c1916">Section 5-11.2 pulls vestibules and stairs into the same fragment-reduction rule as 5-11.1. Do not price those openings as unprotected interior glass.</text>
<text x="80" y="556" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b42318">REDLINE: calling a vestibule or stair lite "interior" does not drop 5-11.</text>
<text x="80" y="580" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6258">Doors are 5-12.1. Confirm opening type before you exclude it.</text>
