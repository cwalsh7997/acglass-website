<text x="390" y="372" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6b6258">TYP. STOREFRONT LITE</text>

<ellipse cx="390" cy="170" rx="118" ry="36" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="390" y="174" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#b42318">1  IGU MAKEUP</text>


<ellipse cx="560" cy="320" rx="92" ry="34" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="560" y="324" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#b42318">2  BITE</text>


<ellipse cx="300" cy="480" rx="110" ry="34" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="300" y="484" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#b42318">3  VESTIBULE?</text>


<ellipse cx="500" cy="560" rx="118" ry="32" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="500" y="564" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#b42318">4  REPLACEMENT</text>

<text x="40" y="640" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b42318">REDLINE SET (INVENTED TYPICAL, NOT A JOB)</text>
<text x="40" y="660" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">1  Confirm inboard lite is laminated or PC. A Florida</text>
<text x="40" y="680" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">   impact IGU that laminates outboard is not 5-11.1.</text>
<text x="40" y="700" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">2  Show silicone bite (larger of 3/8 in or glass</text>
<text x="40" y="720" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">   thickness) or tape bite = 2x laminated thickness.</text>
<text x="40" y="740" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">3  If this lite sits in a vestibule or stair, 5-11.2</text>
<text x="40" y="760" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">   still applies. Do not mark it interior-unprotected.</text>
<text x="40" y="780" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">4  Window replacement on an inhabited DoD building</text>
<text x="40" y="800" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">   triggers 5-11 under 5-1.1.2.1. Not a 50% trigger.</text>
<text x="40" y="820" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">Do not invent an NOA ID, design pressure, U-factor,</text>
<text x="40" y="840" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1c1916">or SHGC on this sheet. Those stay project-specific.</text>
</svg>
