<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img">
<rect width="1100" height="640" fill="#fbf7f0"/>

<rect x="16" y="12" width="1068" height="28" fill="none" stroke="#0e284f" stroke-width="1.2"/>
<text x="28" y="31" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0e284f">FIG 03</text>
<text x="1072" y="31" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#b42318">TYPICAL 5x7 SF-1 · NOT A PROJECT DRAWING</text>
<rect x="16" y="594" width="1068" height="30" fill="none" stroke="#0e284f" stroke-width="1.2"/>
<text x="28" y="614" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0e284f">ACG REDLINE CLINIC</text>
<text x="550.0" y="614" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#1c1916">Silicone bite vs structural tape bite</text>
<text x="1072" y="614" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6258">INVENTED TYPICAL LITE</text>

<rect x="90" y="80" width="420" height="360" fill="#fffdf8" stroke="#0e284f"/>
<text x="110" y="108" font-family="Georgia, Times, serif" font-size="16" fill="#0e284f">Silicone (5-11.1)</text>
<rect x="140" y="140" width="80" height="220" fill="#b8b2a8" stroke="#0e284f"/>
<rect x="220" y="160" width="36" height="180" fill="#7ea8c4" stroke="#1c1916"/>
<rect x="208" y="160" width="12" height="180" fill="#b42318" opacity="0.35"/>
<path d="M208 250 H170" stroke="#b42318" stroke-width="1.4"/>
<text x="250" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1c1916">bite = larger of</text>
<text x="250" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#b42318">3/8 in or glass thk</text>
<text x="250" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1c1916">bead 3/16 in min.</text>
<text x="110" y="400" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">On a 1/4 in laminated lite the silicone bite floor is 3/8 in.</text>
<rect x="560" y="80" width="460" height="360" fill="#fffdf8" stroke="#0e284f"/>
<text x="580" y="108" font-family="Georgia, Times, serif" font-size="16" fill="#0e284f">Structural tape (5-11.1)</text>
<rect x="610" y="140" width="80" height="220" fill="#b8b2a8" stroke="#0e284f"/>
<rect x="690" y="160" width="36" height="180" fill="#7ea8c4" stroke="#1c1916"/>
<rect x="678" y="160" width="12" height="180" fill="#b42318"/>
<text x="740" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1c1916">tape bite =</text>
<text x="740" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#b42318">2x laminated-glass thk</text>
<text x="740" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1c1916">UFC 4-010-01 §5-11.1</text>
<text x="580" y="400" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">On a 1/4 in laminated lite the tape bite floor is 1/2 in.</text>
<text x="90" y="480" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#1c1916">Bite applies on both sides of a single pane and on the inboard lite only of an IGU. A laminate without the specified bite is incomplete.</text>
<text x="90" y="508" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b42318">REDLINE: shops that omit bite fail 5-11.1 even if the word laminated appears.</text>
</svg>
