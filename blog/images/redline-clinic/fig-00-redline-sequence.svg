<text x="354" y="72" font-family="Georgia, Times, serif" font-size="13" fill="#0e284f">Bite</text>
<text x="330" y="104" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#1c1916"></text>

<text x="332" y="96" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">Silicone: larger of 3/8 in</text>
<text x="332" y="116" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">or glass thickness. Tape: 2x</text>
<text x="332" y="136" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">laminated-glass thickness.</text>
<rect x="332" y="250" width="248" height="88" fill="#fbf7f0" stroke="#d8cfc2"/>
<rect x="352" y="268" width="70" height="52" fill="#b8b2a8"/>
<rect x="372" y="278" width="36" height="32" fill="#c5d8e6"/>
<path d="M372 294 H356" stroke="#b42318" stroke-width="2"/>
<text x="432" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#b42318">bite + bead</text>
<text x="432" y="312" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0e284f">tape = 2x thickness</text>

<rect x="608" y="56" width="280" height="300" fill="#fffdf8" stroke="#0e284f" stroke-width="1"/>
<rect x="608" y="56" width="28" height="22" fill="#b42318"/>
