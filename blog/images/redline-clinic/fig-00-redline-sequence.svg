<text x="38" y="72" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#fff">01</text>
<text x="62" y="72" font-family="Georgia, Times, serif" font-size="13" fill="#0e284f">IGU makeup</text>
<text x="38" y="104" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#1c1916"></text>

<text x="40" y="96" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">Florida impact often</text>
<text x="40" y="116" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">laminates outboard. UFC</text>
<text x="40" y="136" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">5-11.1 laminates the inboard</text>
<text x="40" y="156" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">lite.</text>
<rect x="40" y="250" width="248" height="88" fill="#fbf7f0" stroke="#d8cfc2"/>
<rect x="60" y="262" width="18" height="64" fill="#7ea8c4"/>
<rect x="82" y="262" width="10" height="64" fill="#e8f2f8"/>
<rect x="96" y="262" width="18" height="64" fill="#d7e4ee"/>
<text x="124" y="288" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#b42318">WRONG: outboard lam</text>
<text x="124" y="308" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0e284f">UFC wants inboard lam</text>

<rect x="316" y="56" width="280" height="300" fill="#fffdf8" stroke="#0e284f" stroke-width="1"/>
