<text x="938" y="72" font-family="Georgia, Times, serif" font-size="13" fill="#0e284f">Replacement</text>
<text x="914" y="104" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#1c1916"></text>

<text x="916" y="96" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">UFC 5-1.1.2.1: window</text>
<text x="916" y="116" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">replacement on an inhabited</text>
<text x="916" y="136" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">DoD building still triggers</text>
<text x="916" y="156" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">5-11.</text>
<rect x="916" y="250" width="248" height="88" fill="#fbf7f0" stroke="#d8cfc2"/>
<text x="928" y="284" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1c1916">inhabited DoD</text>
<text x="928" y="304" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1c1916">+ replace windows</text>
<text x="928" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#b42318">= 5-11, not 50% reno</text>
