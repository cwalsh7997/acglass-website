<text x="646" y="72" font-family="Georgia, Times, serif" font-size="13" fill="#0e284f">Vestibule</text>
<text x="622" y="104" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#1c1916"></text>

<text x="624" y="96" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">UFC 5-11.2 pulls vestibules</text>
<text x="624" y="116" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">and stairs into the same</text>
<text x="624" y="136" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#1c1916">fragment-reduction rule.</text>
<rect x="624" y="250" width="248" height="88" fill="#fbf7f0" stroke="#d8cfc2"/>
