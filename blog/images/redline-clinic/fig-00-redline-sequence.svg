<text x="28" y="394" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0e284f">ACG REDLINE CLINIC</text>
<text x="600.0" y="394" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#1c1916">Four redlines on one typical 5x7 storefront lite</text>
<text x="1172" y="394" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b6258">INVENTED TYPICAL LITE</text>


<rect x="24" y="56" width="280" height="300" fill="#fffdf8" stroke="#0e284f" stroke-width="1"/>
