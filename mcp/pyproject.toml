[project]
name = "acg-mcp-server"
version = "0.1.0"
description = "ACG Data Access — a fact-strict MCP server for looking up American Commercial Glass and Florida commercial glazing data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "American Commercial Glass", email = "connor@acglass.com" }]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
acg-mcp-server = "acg_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acg_mcp_server.py"]
include = ["data/acg_facts.json"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"data/acg_facts.json" = "data/acg_facts.json"
