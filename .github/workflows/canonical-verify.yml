name: Canonical Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Static, no network: reads vercel.json, the sitemaps and the HTML as
      # deployed, so a cannibalization regression fails the PR before it ships.
      - name: Verify canonical / redirect / sitemap model
        run: python .github/scripts/canonical-verify.py
