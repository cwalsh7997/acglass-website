name: NOA Source Review Due

on:
  schedule:
    # 5th of every month at 13:00 UTC
    - cron: '0 13 5 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check source review age without external requests
        id: reverify
        run: |
          set +e
          set -o pipefail
          python3 .github/scripts/noa-status-check.py --max-age-days 35 2>&1 | tee /tmp/reverify.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Open issue on any failure
        if: steps.reverify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/reverify.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `NOA source review due: ${today}`,
              body: '## Monthly NOA source review report\n\n' +
                    'The local source ledger has one or more entries due for manual review. No government portal was contacted by this workflow.\n\n' +
                    '```\n' + report + '\n```\n\n' +
                    'Review the cited sources manually. Update `/noa/data.json` only through the governed NOA publishing workflow.',
              labels: ['noa', 'verification', 'monthly-check']
            });

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noa-reverify-${{ github.run_id }}
          path: /tmp/reverify.txt
          retention-days: 90
