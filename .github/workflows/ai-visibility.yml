name: AI Visibility (monthly)

on:
  schedule:
    # 1st of every month at 12:00 UTC (07:00 EST / 08:00 EDT)
    - cron: '0 12 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ai-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Run AI visibility audit
        env:
          PPLX_API_KEY: ${{ secrets.PPLX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHEETS_SA_JSON: ${{ secrets.SHEETS_SA_JSON }}
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python3 scripts/ai-visibility.py
