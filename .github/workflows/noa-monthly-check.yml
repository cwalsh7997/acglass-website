name: NOA Monthly Status Check

on:
  schedule:
    # 1st of every month at 13:00 UTC (09:00 EDT / 08:00 EST)
    - cron: '0 13 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  noa-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NOA status check
        id: status
        run: |
          set +e
          set -o pipefail
          python3 .github/scripts/noa-status-check.py --max-age-days 90 2>&1 | tee /tmp/noa-status.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Open issue if stale
        if: steps.status.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/noa-status.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `NOA hub source review due: ${new Date().toISOString().slice(0,10)}`,
              body: '```\n' + body + '\n```\n\nReview the cited sources manually. Update `/noa/data.json` only through the governed NOA publishing workflow.',
              labels: ['noa', 'verification']
            });
