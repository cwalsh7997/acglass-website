<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- ACG "A" mark — red diagonal slash + navy/white triangle -->
  <!-- Left: Red diagonal parallelogram -->
  <polygon points="28,0 48,0 20,100 0,100" fill="#E21B2C"/>
  <!-- Right: Navy/white triangle "A" shape -->
  <polygon points="70,20 120,100 92,100 80,75 70,75 62,58 70,58" fill="#1B3052"/>
  <polygon points="70,20 100,100 40,100 70,20" fill="#1B3052"/>
  <!-- Cutout for the "A" opening -->
  <polygon points="70,52 58,82 82,82" fill="white"/>
</svg>
