<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Nicklaus and Thomas-designed golf course">
  <defs>
    <radialGradient id="nbg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#15243D"/>
      <stop offset="100%" stop-color="#070C18"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#nbg)" stroke="#E11320" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(225,19,32,0.35)" stroke-width="0.5"/>
  <text x="50" y="30" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6" fill="#E11320" font-weight="700" letter-spacing="2">DESIGNED BY</text>
  <!-- Golf flag icon -->
  <g transform="translate(50, 52)" fill="#FFFFFF">
    <line x1="0" y1="-12" x2="0" y2="8" stroke="#FFFFFF" stroke-width="1.5"/>
    <polygon points="0,-12 12,-9 0,-6" fill="#E11320"/>
    <ellipse cx="0" cy="9" rx="6" ry="1.5" fill="#9CB87B"/>
    <circle cx="-4" cy="8" r="1.2" fill="#FFFFFF"/>
  </g>
  <text x="50" y="78" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#FFFFFF" font-weight="800" letter-spacing="0.5">NICKLAUS</text>
  <text x="50" y="86" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" fill="rgba(255,255,255,0.65)" font-weight="700" letter-spacing="0.5">+ THOMAS</text>
</svg>
