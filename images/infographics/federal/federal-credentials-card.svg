<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Federal Credentials — ACG Title Block</title>
<desc id="fc-desc">Drafting title-block style credentials card listing UEI, NAICS code, Florida CGC license, bonding capacity, general liability, and workers compensation coverage.</desc>
<defs>
  <style>
    .mono{font-family:'JetBrains Mono',monospace;}
    .head{font-family:'Archivo',sans-serif;}
    .paper{fill:#F0F3F8;}
    .steel{fill:#8FA3BF;}
    .accent{fill:#E11320;}
    .ls{stroke:#8FA3BF;}
    .lp{stroke:#F0F3F8;}
  </style>
</defs>

<!-- outer frame -->
<rect x="20" y="20" width="860" height="280" fill="#0B0F17" fill-opacity="0.55" class="lp" stroke-width="2"/>

<!-- corner ticks -->
<g class="ls" stroke-width="1" opacity="0.6">
  <path d="M20,20 L34,20 M20,20 L20,34" fill="none"/>
  <path d="M20,300 L34,300 M20,300 L20,286" fill="none"/>
</g>

<!-- red revision tick, top-right -->
<path d="M880,20 L860,20 L880,40 Z" fill="#E11320"/>

<!-- header band -->
<text x="40" y="46" class="head paper" font-size="20" font-weight="700" letter-spacing="0.5">FEDERAL CREDENTIALS</text>
<line x1="20" y1="60" x2="880" y2="60" class="ls" stroke-width="1"/>

<!-- vertical divider -->
<line x1="240" y1="60" x2="240" y2="300" class="ls" stroke-width="1"/>

<!-- row dividers -->
<g class="ls" stroke-width="1" opacity="0.6">
  <line x1="20" y1="100" x2="880" y2="100"/>
  <line x1="20" y1="140" x2="880" y2="140"/>
  <line x1="20" y1="180" x2="880" y2="180"/>
  <line x1="20" y1="220" x2="880" y2="220"/>
  <line x1="20" y1="260" x2="880" y2="260"/>
</g>

<!-- ROW 1 : UEI -->
<text x="40" y="86" class="mono steel" font-size="15" letter-spacing="1">UEI</text>
<text x="260" y="87" class="mono paper" font-size="17" letter-spacing="0.5">QTQYMLLL9PS4</text>

<!-- ROW 2 : NAICS -->
<text x="40" y="126" class="mono steel" font-size="15" letter-spacing="1">NAICS</text>
<text x="260" y="127" class="mono paper" font-size="17" letter-spacing="0.5">238150</text>

<!-- ROW 3 : FL CGC -->
<text x="40" y="166" class="mono steel" font-size="15" letter-spacing="1">FL CGC</text>
<text x="260" y="167" class="mono paper" font-size="17" letter-spacing="0.5">1531993</text>

<!-- ROW 4 : BONDING -->
<text x="40" y="206" class="mono steel" font-size="15" letter-spacing="1">BONDING</text>
<text x="260" y="207" class="mono paper" font-size="17" letter-spacing="0.5">$3M SINGLE / $6M AGGREGATE</text>

<!-- ROW 5 : GL -->
<text x="40" y="246" class="mono steel" font-size="15" letter-spacing="1">GL</text>
<text x="260" y="247" class="mono paper" font-size="17" letter-spacing="0.5">$1M/$2M</text>

<!-- ROW 6 : WC -->
<text x="40" y="286" class="mono steel" font-size="15" letter-spacing="1">WC</text>
<text x="260" y="287" class="mono paper" font-size="17" letter-spacing="0.5">$1M</text>

</svg>
