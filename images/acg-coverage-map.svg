<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto;display:block;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;">
  <title id="title">ACG Florida coverage map</title>
  <desc id="desc">Map highlighting American Commercial Glass in Florida, with offices in West Palm Beach, Naples, and Tampa.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1424"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="floridaFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11320" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#9F0C17" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="stateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11320" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E11320" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="url(#background)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="0" y1="336" x2="900" y2="336"/>
    <line x1="0" y1="448" x2="900" y2="448"/>
    <line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
  </g>

  <g transform="translate(50 44)">
    <text x="0" y="0" fill="rgba(255,255,255,0.5)" font-size="10" font-weight="700" letter-spacing="2.5">AMERICAN COMMERCIAL GLASS</text>
    <text x="0" y="34" fill="#fff" font-size="29" font-weight="900" letter-spacing="-0.8">Florida Coverage</text>
    <text x="0" y="58" fill="rgba(255,255,255,0.62)" font-size="12" font-weight="600" letter-spacing="0.5">WEST PALM BEACH | NAPLES | TAMPA</text>
  </g>

  <g transform="translate(50 166)">
    <text x="0" y="0" fill="rgba(255,255,255,0.5)" font-size="10" font-weight="700" letter-spacing="2">FLORIDA OPERATIONS</text>

    <text x="0" y="55" fill="#fff" font-size="22" font-weight="900">350+</text>
    <text x="82" y="55" fill="rgba(255,255,255,0.82)" font-size="14" font-weight="700">Commercial projects</text>
    <line x1="0" y1="78" x2="258" y2="78" stroke="rgba(255,255,255,0.12)"/>

    <text x="0" y="127" fill="#fff" font-size="22" font-weight="900">1M+ SF</text>
    <text x="99" y="127" fill="rgba(255,255,255,0.82)" font-size="14" font-weight="700">Glazing installed</text>
    <line x1="0" y1="150" x2="258" y2="150" stroke="rgba(255,255,255,0.12)"/>

    <text x="0" y="199" fill="#fff" font-size="22" font-weight="900">3</text>
    <text x="28" y="199" fill="rgba(255,255,255,0.82)" font-size="14" font-weight="700">Current Florida offices</text>
  </g>

  <rect x="340" y="128" width="510" height="336" rx="20" fill="rgba(3,8,15,0.38)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="650" cy="310" r="245" fill="url(#stateGlow)"/>
  <text x="594" y="168" fill="rgba(255,255,255,0.5)" font-size="10" font-weight="800" letter-spacing="2.2">FLORIDA FOOTPRINT</text>

  <g transform="translate(-1280 -1160) scale(3)" filter="url(#softShadow)">
    <path d="M 555 465 L 620 460 L 660 475 L 690 495 L 720 510 L 700 530 L 660 525 L 620 510 L 580 490 L 555 480 Z" fill="url(#floridaFill)" stroke="#E11320" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  </g>

  <g>
    <circle cx="610" cy="310" r="18" fill="rgba(225,19,32,0.16)"/>
    <circle cx="610" cy="310" r="6" fill="#E11320" stroke="#fff" stroke-width="1.5"/>
    <text x="590" y="303" text-anchor="end" fill="#fff" font-size="10" font-weight="800" letter-spacing="0.7">TAMPA</text>

    <circle cx="670" cy="385" r="18" fill="rgba(225,19,32,0.16)"/>
    <circle cx="670" cy="385" r="6" fill="#E11320" stroke="#fff" stroke-width="1.5"/>
    <text x="648" y="405" text-anchor="end" fill="#fff" font-size="10" font-weight="800" letter-spacing="0.7">NAPLES</text>

    <circle cx="790" cy="370" r="30" fill="rgba(225,19,32,0.2)"/>
    <circle cx="790" cy="370" r="8" fill="#E11320" stroke="#fff" stroke-width="1.8"/>
    <circle cx="790" cy="370" r="3" fill="#fff"/>
    <text x="770" y="357" text-anchor="end" fill="#fff" font-size="10" font-weight="800" letter-spacing="0.7">WEST PALM BEACH</text>
    <text x="770" y="373" text-anchor="end" fill="rgba(255,255,255,0.62)" font-size="9" font-weight="700" letter-spacing="0.7">HEADQUARTERS</text>
  </g>

  <line x1="50" y1="490" x2="850" y2="490" stroke="rgba(255,255,255,0.1)"/>
  <text x="50" y="522" fill="rgba(255,255,255,0.5)" font-size="10" font-weight="700" letter-spacing="1.2">COMMERCIAL GLAZING | DIVISION 08 | FLORIDA</text>
  <text x="850" y="522" text-anchor="end" fill="rgba(255,255,255,0.5)" font-size="10" font-weight="600" letter-spacing="0.7">acglass.com</text>
</svg>
